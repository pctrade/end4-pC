name: Changelog

# Rebuilds CHANGELOG.md from merged pull requests.
# Nothing to write by hand: the titles of the PRs are the changelog.

on:
  push:
    branches: [main]
    # The commit this workflow pushes only touches CHANGELOG.md,
    # so ignoring it here is what keeps the workflow from retriggering itself.
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Changelog"
            echo
            echo "Every merged pull request, newest first, grouped by month."
            echo "Generated by \`.github/workflows/changelog.yml\` — do not edit by hand."
            echo
            gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 1000 \
              --json number,title,mergedAt,author \
              --jq '
                map(select(.mergedAt != null))
                | group_by(.mergedAt[0:7])
                | sort_by(.[0].mergedAt) | reverse
                | map(
                    "## " + .[0].mergedAt[0:7] + "\n\n" +
                    ( sort_by(.mergedAt) | reverse
                      | map("- \(.mergedAt[0:10]) #\(.number) \(.title) — @\(.author.login)")
                      | join("\n") )
                  )
                | join("\n\n")
              '
          } > CHANGELOG.md

      - name: Commit if it changed
        run: |
          # git add first: a brand new CHANGELOG.md is untracked, and
          # "git diff" alone would not see it.
          git add CHANGELOG.md
          if git diff --staged --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(changelog): update from merged pull requests"
          git push
